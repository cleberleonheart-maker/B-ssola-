name: Build e publica APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'src/**'
      - '__tests__/**'
      - 'jest.config.js'
      - 'jest.setup.js'
      - '.eslintrc.js'
      - 'App.tsx'
      - 'android/app/src/**'
      - 'android/app/build.gradle'
      - 'android/app/version.properties'
      - 'android/app/release-cert.sha256'
      - 'android/gradle.properties'
      - 'android/build.gradle'
      - 'package.json'
      - 'package-lock.json'
      - 'patches/**'
      # Config do build que o filtro antigo deixava passar: mudar qualquer um
      # destes sem disparar build produz APK desatualizado em silencio.
      - 'index.js'
      - 'tsconfig.json'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'android/settings.gradle'
      - 'android/gradle/**'
      - 'android/app/proguard-rules.pro'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Confere coerencia da versao
        run: |
          set -euo pipefail
          PROPS=android/app/version.properties
          GEN=src/version.generated.ts

          # O "|| true" e necessario: com pipefail, um grep sem match aborta o
          # script em silencio, e a falha aparece sem nenhuma mensagem util.
          CODE=$(grep -E '^versionCode=' "$PROPS" | cut -d'=' -f2 || true)
          NAME=$(grep -E '^versionName=' "$PROPS" | cut -d'=' -f2 || true)
          GEN_CODE=$(grep -E '^export const APP_VERSION_CODE' "$GEN" | grep -oE '[0-9]+' || true)
          GEN_NAME=$(grep -E "^export const APP_VERSION =" "$GEN" | sed -E "s/.*= 'v([^']+)'.*/\1/" || true)

          if [ -z "$CODE" ] || [ -z "$NAME" ] || [ -z "$GEN_CODE" ] || [ -z "$GEN_NAME" ]; then
            echo "::error::nao consegui ler a versao de $PROPS e $GEN"
            exit 1
          fi
          if [ "$CODE" != "$GEN_CODE" ] || [ "$NAME" != "$GEN_NAME" ]; then
            echo "::error::$PROPS e $GEN divergem"
            echo "::error::$PROPS: code=$CODE name=$NAME"
            echo "::error::$GEN: code=$GEN_CODE name=$GEN_NAME"
            echo "::error::o app anunciaria uma versao que nao corresponde ao build"
            exit 1
          fi
          echo "versao coerente: $CODE ($NAME)"

      - name: Lint, tipos e testes
        run: |
          npx eslint .
          npm run typecheck
          npm test -- --ci --runInBand

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (assembleRelease)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/bussola-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          fi
          cd android
          ./gradlew assembleRelease -x lint -x test

      - name: Confere a assinatura do APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          CERTS=android/app/release-cert.sha256

          if [ ! -f "$APK" ]; then
            echo "::error::APK nao encontrado: $APK"
            exit 1
          fi
          if [ ! -f "$CERTS" ]; then
            echo "::error::fingerprint esperado nao encontrado: $CERTS"
            exit 1
          fi

          APKSIGNER=$(ls -1d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner nao encontrado em \$ANDROID_HOME/build-tools"
            exit 1
          fi

          # $NF: o prefixo da linha varia entre versoes do apksigner
          # ("Signer #1 certificate..." vs "V2 Signer: certificate...").
          norm() { tr -d ' \n\r:' | tr 'A-Z' 'a-z'; }
          EXPECTED=$(norm < "$CERTS")
          FOUND=$("$APKSIGNER" verify --print-certs "$APK" \
            | awk -F': ' '/certificate SHA-256 digest/ {print $NF}' | norm || true)

          if [ -z "$FOUND" ]; then
            echo "::error::nao foi possivel ler o certificado de $APK"
            exit 1
          fi
          if ! printf '%s' "$FOUND" | grep -qx "$EXPECTED"; then
            echo "::error::APK assinado com a chave errada"
            echo "::error::esperado: $EXPECTED"
            echo "::error::obtido:   $(echo "$FOUND" | tr '\n' ' ')"
            echo "::error::um APK com outra chave nao atualiza por cima do app ja instalado"
            exit 1
          fi
          echo "assinatura conferida: $EXPECTED"

      - name: Publicar APK no release
        id: publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          CODE=$(grep -E '^versionCode=' android/app/version.properties | cut -d'=' -f2)
          NAME=$(grep -E '^versionName=' android/app/version.properties | cut -d'=' -f2)
          ASSET="bussola-v${CODE}.apk"
          TMP=/tmp/$ASSET
          cp "$APK" "$TMP"
          LOCAL_SHA=$(sha256sum "$TMP" | cut -d' ' -f1)

          # O digest que a GitHub calcula por asset: a mesma fonte que o app
          # usa quando a nuvem nao tem hash.
          digest_de() {
            gh release view bussola-apk --repo "$GITHUB_REPOSITORY" --json assets --jq \
              ".assets[] | select(.name == \"$1\") | .digest" 2>/dev/null \
              | sed -E 's/^sha256://' | tr 'A-Z' 'a-z' | head -1 || true
          }

          PUBLICADO=$(digest_de "$ASSET")
          if [ -n "$PUBLICADO" ]; then
            # O APK publicado de uma versao e' IMUTAVEL. Nao se substitui.
            #
            # Substitui-lo rodava mal por duas razoes ao mesmo tempo: quem ja'
            # instalou a v211 tem os bytes antigos, e trocar o ficheiro faz o
            # digest rodiar — o hash que o repositorio guarda deixa de bater
            # e o app da' "hash nao bate certo" a quem tenta atualizar. Um APK
            # novo e' uma versao nova: sobe o versionCode.
            if [ "$PUBLICADO" != "$LOCAL_SHA" ]; then
              echo "::warning::o asset $ASSET ja' estava publicado (sha256 $PUBLICADO) e este build da' $LOCAL_SHA."
              echo "::warning::o APK publicado de uma versao nao se substitui: o que ja' foi instalado fica com os bytes antigos."
              echo "::warning::as alteracoes no codigo so saem na proxima versao (com o versionCode subido)."
            else
              echo "O asset publicado e' byte a byte igual a este build."
            fi
          elif gh release view bussola-apk --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Sem `--clobber`: se o asset ja' existir, o upload falha em vez de
            # substitui-lo. A falha nao parte a release — o digest em baixo
            # diz se o asset ficou la' (corridas simultaneas) ou nao.
            gh release upload bussola-apk "$TMP" --repo "$GITHUB_REPOSITORY" \
              || echo "::warning::o upload falhou; se o asset ja' existia, fica o que la' estava."
          else
            gh release create bussola-apk "$TMP" --repo "$GITHUB_REPOSITORY" \
              --title "Bussola APK ($NAME, cod $CODE)" \
              --notes "APK release do app Bussola. Baixe o ultimo asset."
          fi

          if gh release view bussola-apk --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Sem isto o titulo fica congelado na versao que criou o release
            # (v7.0, cod 80) mesmo com assets bem mais novos.
            gh release edit bussola-apk --repo "$GITHUB_REPOSITORY" \
              --title "Bussola APK ($NAME, cod $CODE)" || true
          fi

          # O hash que vai para a nuvem e' o do asset PUBLICADO, nunca o deste
          # build: sao o mesmo ficheiro, mas o publicado e' o que os
          # utilizadores descarregam e o que o app compara.
          PUBLICADO=$(digest_de "$ASSET")
          if ! printf '%s' "$PUBLICADO" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::nao consegui ler o digest do asset $ASSET na release"
            exit 1
          fi

          echo "Publicado: https://github.com/$GITHUB_REPOSITORY/releases/tag/bussola-apk"
          echo "apk_name=$ASSET" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$PUBLICADO" >> "$GITHUB_OUTPUT"

      - name: Grava app_version no Supabase
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          : "${SUPABASE_SERVICE_ROLE_KEY:?defina o secret SUPABASE_SERVICE_ROLE_KEY}"
          : "${SUPABASE_URL:?defina o secret SUPABASE_URL}"
          CODE=$(grep -E '^versionCode=' android/app/version.properties | cut -d'=' -f2)
          NAME=$(grep -E '^versionName=' android/app/version.properties | cut -d'=' -f2)
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/bussola-apk/bussola-v${CODE}.apk"
          SHA="${{ steps.publicar.outputs.apk_sha256 }}"
          if ! printf '%s' "$SHA" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::o passo anterior nao passou o sha256 do asset publicado"
            exit 1
          fi
          BODY="{\"version_code\":$CODE,\"version_name\":\"$NAME\",\"update_url\":\"$URL\",\"message\":\"Nova versão disponível\",\"required\":false,\"apk_sha256\":\"$SHA\"}"
          # `apk_sha256` é a segunda fonte do hash, a par do `digest` que a GitHub
          # calcula por asset: uma de cada lado. Sem a coluna (SQL ainda não
          # corrido), o PATCH falha e a release não saía — daí a segunda
          # tentativa sem o campo, que ainda publica o update.
          #
          # A segunda tentativa NÃO leva `apk_sha256: null`: se a coluna não
          # existe, não há hash nenhum para limpar, e omitir o campo é o
          # único caminho que funciona. Um `null` aqui também falharia
          # (a coluna não existe) e, se a coluna existisse mas o PATCH
          # tivesse falhado por outra coisa, limpar um hash bom seria pior
          # do que deixar o hash velho.
          #
          # O filtro `version_code=lte.$CODE` é a outra guarda: um run antigo
          # (um commit mais velho que só agora termina o build) não pode
          # rebaixar o ponteiro que uma release mais nova já gravou.
          PATCH_URL="$SUPABASE_URL/rest/v1/app_version?id=eq.1&version_code=lte.$CODE"
          HTTP=$(curl -sS -o /tmp/app_version.json -w '%{http_code}' -X PATCH "$PATCH_URL" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "$BODY" || true)
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            if grep -qiE 'apk_sha256|42703|PGRST204' /tmp/app_version.json; then
              echo "::warning::a coluna apk_sha256 ainda não existe na nuvem; a publicar sem a segunda fonte do hash"
              BODY="{\"version_code\":$CODE,\"version_name\":\"$NAME\",\"update_url\":\"$URL\",\"message\":\"Nova versão disponível\",\"required\":false}"
              HTTP=$(curl -sS -o /tmp/app_version.json -w '%{http_code}' -X PATCH "$PATCH_URL" \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Content-Type: application/json" \
                -H "Prefer: return=representation" \
                -d "$BODY" || true)
            fi
          fi
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "::error::PATCH do app_version falhou (http $HTTP)"
            cat /tmp/app_version.json
            exit 1
          fi
          if [ ! -s /tmp/app_version.json ] || [ "$(cat /tmp/app_version.json)" = "[]" ]; then
            echo "::warning::a linha da nuvem não foi tocada: já está numa versão mais nova do que a $CODE (nada foi rebaixado)"
          fi
          echo "app_version -> $CODE ($NAME)"
          echo "URL: $URL"
          echo "sha256: $SHA"

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: bussola-apk
          path: android/app/build/outputs/apk/release/app-release.apk